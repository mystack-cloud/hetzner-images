# Weekly security scan of GHCR images with Trivy. Findings in job summary, artifacts, and Security → Code scanning.
name: Scan images

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.outputs.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
      - name: Image list
        id: outputs
        run: |
          json="[$(yq -r '.images | keys | .[]' config/images.yaml | sort | sed 's/.*/{"image":"&"}/' | paste -sd ',')]"
          matrix="{\"include\":$json}"
          printf 'matrix=%s\n' "${matrix//%/%25}" >> "$GITHUB_OUTPUT"

  scan:
    name: Scan ${{ matrix.image }}
    needs: prepare
    if: needs.prepare.outputs.matrix != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner (table)
        run: |
          docker run --rm \
            -e TRIVY_USERNAME="${{ github.actor }}" \
            -e TRIVY_PASSWORD="${{ secrets.GITHUB_TOKEN }}" \
            -v "${{ github.workspace }}":/work -w /work \
            aquasec/trivy:latest image \
            --format table -o trivy-report.txt \
            --severity CRITICAL,HIGH,MEDIUM \
            --exit-code 0 \
            "${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:latest"

      - name: Ensure report file exists
        if: always()
        run: |
          if [ ! -s trivy-report.txt ]; then
            echo "No vulnerabilities found." > trivy-report.txt
          fi

      - name: Run Trivy vulnerability scanner (SARIF)
        run: |
          docker run --rm \
            -e TRIVY_USERNAME="${{ github.actor }}" \
            -e TRIVY_PASSWORD="${{ secrets.GITHUB_TOKEN }}" \
            -v "${{ github.workspace }}":/work -w /work \
            aquasec/trivy:latest image \
            --format sarif -o trivy-results.sarif \
            --severity CRITICAL,HIGH,MEDIUM \
            --exit-code 0 \
            "${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:latest"

      - name: Upload to Security tab
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: ${{ matrix.image }}

      - name: Publish Trivy report to job summary
        if: always()
        run: |
          echo "### Trivy scan: ${{ matrix.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          REPORT="trivy-report.txt"
          if [ -s "$REPORT" ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No findings." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Extract critical count
        if: always()
        run: |
          critical=$(grep -oP 'CRITICAL:\s*\K\d+' trivy-report.txt 2>/dev/null | head -1)
          echo "${critical:-0}" > critical-count.txt

      - name: Upload Trivy report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.image }}
          path: trivy-report.txt
          retention-days: 30

      - name: Upload critical count
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-${{ matrix.image }}
          path: critical-count.txt
          retention-days: 7

  badges:
    name: Update vulnerability badges
    needs: [prepare, scan]
    if: always() && needs.prepare.outputs.matrix != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq

      - name: Download critical counts
        uses: actions/download-artifact@v4
        with:
          pattern: critical-*
          path: counts
        continue-on-error: true

      - name: Generate badge JSON files
        run: |
          mkdir -p badges counts
          for image in $(yq -r '.images | keys | .[]' config/images.yaml | sort); do
            count_file="counts/critical-${image}/critical-count.txt"
            if [ -f "$count_file" ]; then
              count=$(cat "$count_file")
            else
              count="?"
            fi
            if [ "$count" = "0" ]; then
              color="green"
            elif [ "$count" = "?" ]; then
              color="lightgrey"
            else
              color="red"
            fi
            printf '%s\n' "{\"schemaVersion\":1,\"label\":\"critical\",\"message\":\"${count}\",\"color\":\"${color}\"}" > "badges/${image}.json"
          done

      - name: Commit and push badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/
          if git diff --staged --quiet; then
            echo "No badge changes"
          else
            git commit -m "chore: update vulnerability badges"
            git push
          fi

  update-readme:
    name: Update README
    needs: badges
    permissions:
      contents: write
    uses: ./.github/workflows/update-readme.yml
    with:
      registry: ghcr.io
