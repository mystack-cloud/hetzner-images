x-download-common: &download-common
  build: .
  volumes:
    - .:/workspace
    - /var/run/docker.sock:/var/run/docker.sock
    - ./dist:/workspace/dist
  working_dir: /workspace

services:
  download:
    <<: *download-common
    environment:
      - HETZNER_MIRROR_USER=${HETZNER_MIRROR_USER}
      - HETZNER_MIRROR_PASS=${HETZNER_MIRROR_PASS}
    entrypoint: ["bash", "scripts/download.sh"]
